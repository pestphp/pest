name: Static Analysis

on:
  push:
    branches: [5.x]
  pull_request:
  schedule:
    - cron: '0 9 * * *'

concurrency:
  group: static-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static:
    if: github.event_name != 'schedule' || github.repository == 'pestphp/pest'
    name: Static Tests

    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: true
      matrix:
        dependency-version: [prefer-lowest, prefer-stable]

    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: 8.4
        tools: composer:v2
        coverage: none
        extensions: sockets

    - name: Get Composer cache directory
      id: composer-cache
      shell: bash
      run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

    - name: Cache Composer dependencies
      uses: actions/cache@v5
      with:
        path: ${{ steps.composer-cache.outputs.dir }}
        key: static-php-8.4-${{ matrix.dependency-version }}-composer-${{ hashFiles('**/composer.json', '**/composer.lock') }}
        restore-keys: |
          static-php-8.4-${{ matrix.dependency-version }}-composer-
          static-php-8.4-composer-

    - name: Install Dependencies
      run: composer update --${{ matrix.dependency-version }} --no-interaction --no-progress --ansi

    - name: Profanity Check
      run: composer test:profanity

    - name: Type Check
      run: composer test:type:check

    - name: Type Coverage
      run: composer test:type:coverage

    - name: Style
      run: composer test:lint
