name: Changelog

on:
  push:
    branches: [ 1.x ]
    paths:
      - CHANGELOG.md
      - .github/workflows/changelog.yml
  pull_request:
    branches: [ 1.x ]
    paths:
      - CHANGELOG.md
jobs:
  build:
    runs-on: ubuntu-latest

    if: github.repository == 'pestphp/pest'

    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

    - name: Checkout website repository
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      with:
        token: ${{ secrets.CHANGELOG_KEY }}
        repository: pestphp/docs
        path: pestphp-docs
        ref: master

    - name: Read CHANGELOG.md
      id: package
      uses: juliangruber/read-file-action@271ff311a4947af354c6abcd696a306553b9ec18 # v1
      with:
        path: ./CHANGELOG.md

    - name: Add file headers
      uses: DamianReeves/write-file-action@6929a9a6d1807689191dcc8bbe62b54d70a32b42 # v1.3
      with:
        path: ./CHANGELOG.md
        contents: |
          ---
          title: Changelog
          description: Changelog
          ---
          ${{ steps.package.outputs.content }}

          ----

          Next section: [Upgrade Guide →](/docs/upgrade-guide)
        write-mode: overwrite

    - name: Copy CHANGELOG to website repository
      run: cp CHANGELOG.md pestphp-docs/changelog.md

    - name: Create Pull Request
      uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
      with:
        token: ${{ secrets.CHANGELOG_KEY }}
        commit-message: Update changelog.md
        committer: GitHub Action <noreply@github.com>
        author: ${{ github.actor }} <${{ github.actor }}@users.noreply.github.com>
        title: 'Update changelog.md'
        path: ./pestphp-docs
